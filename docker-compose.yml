services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inflow}
      POSTGRES_DB: ${POSTGRES_DB:-inflow}
    # No host port published by default (backend reaches it over the internal
    # Compose network as `db:5432`). Set POSTGRES_PORT and uncomment to expose
    # it to the host, e.g. for connecting a local DB client.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://inflow:inflow@db:5432/inflow}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      - ./backend:/app
      - ./sample-data:/sample-data
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
